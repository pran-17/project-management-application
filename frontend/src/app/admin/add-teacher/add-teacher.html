<div class="admin-layout">

  <app-admin-sidebar></app-admin-sidebar>

  <main class="admin-main">

    <section class="page-header">

      <div class="header-left">

        <a
          routerLink="/admin/teachers"
          class="back-button">

          ← Back to Teachers

        </a>

        <span class="page-label">
          TEACHER MANAGEMENT
        </span>

        <h1>
          Add New Teacher
        </h1>

        <p>
          Register a new teacher or project guide.
        </p>

      </div>

    </section>


    <section class="form-card">

      <div class="form-card-header">

        <div class="form-icon">
          👨‍🏫
        </div>

        <div>

          <h2>
            Teacher Information
          </h2>

          <p>
            Enter the teacher's professional information.
          </p>

        </div>

      </div>


      <form
        #teacherForm="ngForm"
        (ngSubmit)="saveTeacher()">


        <!-- PERSONAL INFORMATION -->

        <div class="form-section">

          <h3>
            Personal Information
          </h3>

          <div class="form-grid">


            <div class="form-group">

              <label>
                Full Name <span>*</span>
              </label>

              <input
                type="text"
                name="name"
                [(ngModel)]="newTeacher.name"
                placeholder="Enter teacher name"
                required>

            </div>


            <div class="form-group">

              <label>
                Employee ID <span>*</span>
              </label>

              <input
                type="text"
                name="employeeId"
                [(ngModel)]="newTeacher.employeeId"
                placeholder="Enter employee ID"
                required>

            </div>


            <div class="form-group">

              <label>
                Email Address <span>*</span>
              </label>

              <input
                type="email"
                name="email"
                [(ngModel)]="newTeacher.email"
                placeholder="teacher@email.com"
                required>

            </div>

            <div class="form-group">

  <label>
    Password *
  </label>

  <input
    type="password"
    name="password"
    [(ngModel)]="newTeacher.password"
    placeholder="Enter password"
    required>

</div>


            <div class="form-group">

              <label>
                Phone Number
              </label>

              <input
                type="text"
                name="phone"
                [(ngModel)]="newTeacher.phone"
                placeholder="Enter phone number">

            </div>

          </div>

        </div>


        <!-- PROFESSIONAL INFORMATION -->

        <div class="form-section">

          <h3>
            Professional Information
          </h3>

          <div class="form-grid">


            <div class="form-group">

              <label>
                Department <span>*</span>
              </label>

              <select
                name="department"
                [(ngModel)]="newTeacher.department"
                required>

                <option value="">
                  Select Department
                </option>

                <option value="Computer Science">
                  Computer Science
                </option>

                <option value="Information Technology">
                  Information Technology
                </option>

                <option value="Artificial Intelligence">
                  Artificial Intelligence
                </option>

                <option value="Electronics">
                  Electronics
                </option>

                <option value="Mechanical">
                  Mechanical
                </option>

              </select>

            </div>


            <div class="form-group">

              <label>
                Designation <span>*</span>
              </label>

              <select
                name="designation"
                [(ngModel)]="newTeacher.designation"
                required>

                <option value="">
                  Select Designation
                </option>

                <option value="Professor">
                  Professor
                </option>

                <option value="Associate Professor">
                  Associate Professor
                </option>

                <option value="Assistant Professor">
                  Assistant Professor
                </option>

                <option value="Project Guide">
                  Project Guide
                </option>

              </select>

            </div>


            <div class="form-group">

              <label>
                Area of Specialization
              </label>

              <input
                type="text"
                name="specialization"
                [(ngModel)]="newTeacher.specialization"
                placeholder="Example: Artificial Intelligence">

            </div>

          </div>

        </div>


        <div class="form-actions">

          <button
            type="button"
            class="cancel-button"
            (click)="cancel()">

            Cancel

          </button>


          <button
            type="submit"
            class="save-button"
            [disabled]="teacherForm.invalid">

            + Add Teacher

          </button>

        </div>

      </form>

    </section>

  </main>

</div>
